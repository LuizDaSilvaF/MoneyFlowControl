# Server
server.port=${APP_PORT:8081}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://moneyflowcontrol-postgres:${DB_POSTGRES_PORT}/${DB_POSTGRES_NAME}
spring.datasource.username=${DB_POSTGRES_USER}
spring.datasource.password=${DB_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration